function progBar(step){
  var out="";for(var i=1;i<=3;i++)out+='<i class="'+(i<=step?"on":"")+'"></i>';return out;
}
function fmt1(x){return (Math.round(x*10)/10).toFixed(1).replace(".",",")}
function showOnboarding(){
  var wStart=S.bw.length?S.bw[S.bw.length-1].w:75;
  obState={step:1,g:S.gender||"",nick:S.name||"",lang:S.lang||"ru",w:wStart,goal:S.goalType||"lose",t:S.goalWeight!=null?S.goalWeight:Math.max(30,wStart-3)};
  document.getElementById("obov").classList.add("on");
  renderOb();
}
function finishOnboarding(skip){
  if(!skip){
    S.gender=obState.g;
    if(obState.nick.trim())S.name=obState.nick.trim();
    S.goalType=obState.goal;S.goalWeight=obState.t;
    /* Вес: при первом знакомстве — первая запись; при повторном — если вес изменили, это сегодняшнее взвешивание.
       Остальные данные (тренажёры, история, питание) повторное знакомство не трогает. */
    var lastBw=S.bw.length?chrono(S.bw)[S.bw.length-1]:null;
    if(!lastBw)S.bw=[{t:Date.now(),w:obState.w}];
    else if(Math.abs(lastBw.w-obState.w)>=0.05){var tt=Date.now(),tk=dateKey(tt);S.bw=S.bw.filter(function(x){return dateKey(x.t)!==tk});S.bw.push({t:tt,w:Math.round(obState.w*10)/10});S.bw.sort(function(x,y){return x.t-y.t})}
    S.theme=obState.theme||S.theme;
    S.lang=obState.lang;
  }
  S.onboarded=true;save();
  document.getElementById("obov").classList.remove("on");

var TAB_ORDER=["workout","weight","kbju","history"],lastRenderTab=null;
function fadeTargets(root){
  /* листья без стекла внутри + сами стеклянные блоки; обёртки со стеклом внутри — раскрываем */
  var glass=[],all=root.getElementsByTagName("*");
  for(var i=0;i<all.length;i++){var cs=getComputedStyle(all[i]),bf=cs.backdropFilter||cs.webkitBackdropFilter;if(bf&&bf!=="none")glass.push(all[i])}
  var out=[];
  (function walk(el){
    for(var c=el.firstElementChild;c;c=c.nextElementSibling){
      var hasInner=false;
      for(var j=0;j<glass.length;j++){if(glass[j]!==c&&c.contains(glass[j])){hasInner=true;break}}
      if(hasInner&&glass.indexOf(c)<0)walk(c);else out.push(c);
    }
  })(root);
  return out;
}
function reduceMotion(){return window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches}
var APPLE_EASE="cubic-bezier(.32,.72,0,1)";
/* Прокрутка при перерисовке. Экран, шторка и вкладка перерисовываются целиком при каждом нажатии (+/−, ✓, ★),
   из-за этого прокрутка сбрасывалась наверх. Запоминаем позиции всех прокручиваемых блоков и возвращаем их. */
function scrollKey(n,root){if(n===root)return ":root";if(n.id)return "#"+n.id;var c=(n.className&&typeof n.className==="string")?n.className.trim().split(/\s+/)[0]:"";return c?"."+c:""}
function scrollSnap(root){var out=[];if(!root)return out;[root].concat([].slice.call(root.querySelectorAll("*"))).forEach(function(n){if(n.scrollTop>0||n.scrollLeft>0){var k=scrollKey(n,root);if(k)out.push([k,n.scrollTop,n.scrollLeft])}});return out}
function scrollRestore(root,snap){if(!root||!snap||!snap.length)return;function go(){snap.forEach(function(x){var n=x[0]===":root"?root:root.querySelector(x[0]);if(n){if(n.scrollTop!==x[1])n.scrollTop=x[1];if(n.scrollLeft!==x[2])n.scrollLeft=x[2]}})}go();requestAnimationFrame(function(){go();requestAnimationFrame(go)});setTimeout(go,60);setTimeout(go,220)}
function render(){
  var abg=document.getElementById("appbg");if(abg)abg.classList.toggle("kpast",S.tab==="kbju"&&!!kbjuSel&&kbjuSel!==kbToday());
  var appEl=document.getElementById("app");if(appEl)appEl.classList.toggle("kbsec",S.tab==="kbju");
  var switchedTab=lastRenderTab!==null&&lastRenderTab!==S.tab,dir=0;
  if(switchedTab){
    var oi=TAB_ORDER.indexOf(lastRenderTab),ni=TAB_ORDER.indexOf(S.tab);
    dir=ni>oi?1:-1;
  }
  var keepApp=!switchedTab&&lastRenderTab!==null?scrollSnap(appEl):null;
  /* iPhone прокручивает к кнопке в фокусе, когда её перерисовывают (вода, +/−) — снимаем фокус заранее */
  try{var ae=document.activeElement;if(ae&&ae!==document.body&&ae.tagName==="BUTTON"&&appEl&&appEl.contains(ae))ae.blur()}catch(e){}
  if(S.tab==="workout")viewWorkout();else if(S.tab==="weight")viewWeight();else if(S.tab==="history")viewHistory();else viewKbju();
  if(keepApp)scrollRestore(appEl,keepApp);
  navBar();
  applyTheme();
  applyBgTransform();
  syncBgHeight();
  if(switchedTab&&!reduceMotion()){
    var ac=document.getElementById("appcontent");
    if(ac&&ac.animate){
      if(ac._tabAnim)ac._tabAnim.cancel();
      /* сдвиг — на контейнере, а прозрачность — на самих блоках:
         opacity у предка ломает backdrop-filter (матовое стекло появлялось только после анимации) */
      ac._tabAnim=ac.animate([
        {transform:"translateX("+(dir*18)+"px) scale(.985)"},
        {transform:"none"}
      ],{duration:360,easing:APPLE_EASE});
      fadeTargets(ac).forEach(function(el){
        el.animate([{opacity:0},{opacity:1}],{duration:300,easing:APPLE_EASE});
      });
    }
  }
  lastRenderTab=S.tab;
}

    kbOpenManual({text:"гречка и курица"});KM.ai="fail";KM.retryAdd=false;kmPaint();

  else if(/^onboarding-[123]$/.test(view)){
    showOnboarding();obState.step=+view.slice(-1);obState.theme=S.theme;renderOb();
  }else if(view==="personal-record"){
    var m=S.m[0]||seed()[0];showPR(m.n,m.st,m.w+m.st,m.w,m.h.length?m.h[0].t:null,null);
  }
  document.getElementById("app").scrollTop=0;
  document.documentElement.dataset.catalogView=view;
  redesignMarkRoute();
  catalogReady=true;
}

/* Two skins share one source engine and one product state. Native theme enums
   stay valid; their presentation is independently owned by the redesigned kit. */
var redesignTheme=CATALOG_QUERY_THEME||((S.redesignTheme==="white"||S.redesignTheme==="black")?S.redesignTheme:"black");
var redesignLastDownload=null;
/* Keep native background selection, photo upload and dimming functional while
   mapping the two retained enum values onto the approved material palettes. */
BG_TH.g={bg:"#e8e7e2",acc:"#ff510c"};
BG_GLOW.g=["rgba(255,81,12,.055)","rgba(245,245,240,.28)","rgba(238,238,231,.06)"];
BG_TH.b={bg:"#020303",acc:"#e8edf0"};

var redesignNativeBgCss=bgCss;
bgCss=function(kind,theme){
  var result=redesignNativeBgCss(kind,theme);

};
function redesignApplyTheme(){
  document.documentElement.dataset.redesignTheme=redesignTheme;
  document.body.dataset.redesignTheme=redesignTheme;
  document.body.classList.toggle("theme-white",redesignTheme==="white");
  document.body.classList.toggle("theme-black",redesignTheme==="black");
}
function redesignMarkRoute(){
  var route=catalogCurrentView();
  document.documentElement.dataset.redesignRoute=route;
  document.body.dataset.redesignRoute=route;
  return route;
}
function redesignThemeControls(root){
  if(!root)return;
  root.querySelectorAll(".settthemes .obthm,.obthemecard .obthm").forEach(function(button){
    var value=button.dataset.v;
    if(value!=="b"&&value!=="g"){button.remove();return;}
    var theme=value==="b"?"black":"white",name=button.querySelector(".nm"),preview=button.querySelector(".rg");
    if(name)name.textContent=theme==="black"?"Black":"White";
    if(preview)preview.innerHTML='<span class="rd-theme-preview '+theme+'" aria-hidden="true"></span>';
    button.style.removeProperty("--tacc");
    button.dataset.redesignThemeChoice=theme;
    button.setAttribute("aria-pressed",String(theme===redesignTheme));
    button.classList.toggle("on",theme===redesignTheme);
  });
  var themeCaption=root.querySelector(".settthemes");
  if(themeCaption){
    var heading=themeCaption.parentElement.querySelector(".setth span");
    if(heading)heading.textContent=redesignTheme==="black"?"Black":"White";
  }
}
function redesignSetTheme(theme,persist){
  if(theme!=="black"&&theme!=="white")return;
  redesignTheme=theme;S.redesignTheme=theme;S.theme=theme==="black"?"b":"g";
  if(obState)obState.theme=S.theme;
  redesignApplyTheme();
  if(persist){
    save();
    var url=new URL(location.href);url.searchParams.set("theme",theme);history.replaceState(null,"",url.href);
  }
}
function redesignDownloadExport(data,filename){
  try{
    var isJson=/\.json$/i.test(filename),mime=isJson?"application/json;charset=utf-8":"text/csv;charset=utf-8";
    var blob=new Blob([isJson?data:"\uFEFF"+data],{type:mime}),downloadUrl=URL.createObjectURL(blob),link=document.createElement("a");
    link.href=downloadUrl;link.download=filename;link.hidden=true;document.body.appendChild(link);link.click();link.remove();
    redesignLastDownload={filename:filename,mime:mime,bytes:blob.size,t:Date.now()};
    setTimeout(function(){URL.revokeObjectURL(downloadUrl);},1000);
    expDone=true;toast("Файл выгружен: "+filename);
    if(scrStack[scrStack.length-1]==="settings")renderScreenView();
    catalogSend("export",{download:redesignLastDownload});
  }catch(error){toast("Не удалось выгрузить файл");catalogSend("error",{message:String(error.message||error)});}
}
