<!DOCTYPE html>
<html lang="ru" data-redesign-theme="black">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gym Tracker — Black / White</title>
<style>
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#0F1012;--card:rgba(252,252,252,.03);--card2:rgba(252,252,252,.05);--ink:#FCFCFC;--muted:#7C7C74;--line:rgba(252,252,252,.08);
  --track:#2A2B2F;--wine:#232427;--wine2:#1c1d20;--wine3:var(--on-acc);--on-wine:#FCFCFC;--rose:#18191C;
  --coin:#18191C;--coin-ink:#FCFCFC;--acc:#B2EE37;--acc2:#58F670;--on-acc:#0F1012;--chipbg:rgba(252,252,252,.03);--chipink:#7C7C74;--done:#B2EE37;
  --acc-grad:linear-gradient(135deg,var(--acc),var(--acc2));
  --glass-blur:blur(18px);
  --font-num:"Barlow Condensed","Arial Narrow",Impact,sans-serif;--font:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  /* КБЖУ (карта TH холста) */
  --surface:#18191C;--a:178,238,55;--a2:88,246,112;--warn:#FF8A6B;--warnl:rgba(255,138,107,.4);--sheet:#141517;--bg2:#07080A;--ktrack:#25262A;
  --num:'Barlow Condensed','Arial Narrow',sans-serif;--glow:radial-gradient(55% 60% at 12% 22%,rgba(118,168,52,.95) 0%,rgba(84,128,36,.7) 35%,rgba(50,80,24,.35) 70%,rgba(0,0,0,0) 100%);
  --mchip-onfg:var(--on-acc);--mchip-onbase:color-mix(in srgb,var(--on-acc) 28%,transparent);
}
:root[data-theme="p"]{
  --bg:#140E12;--card:rgba(255,247,250,.03);--card2:rgba(255,247,250,.05);--ink:#FFF7FA;--muted:#9C8A94;--line:rgba(255,247,250,.08);
  --track:#3A2C35;--rose:#221A20;--acc:#FF8FB8;--acc2:#FFC2D6;--on-acc:#140E12;--chipbg:rgba(255,247,250,.03);--chipink:#9C8A94;--done:#FF8FB8;
  --surface:#221A20;--a:255,143,184;--a2:255,194,214;--sheet:#1B1419;--bg2:#0E090C;--ktrack:#3A2C35;--glow:radial-gradient(55% 60% at 12% 22%,rgba(214,92,142,.95) 0%,rgba(170,60,110,.7) 35%,rgba(100,30,64,.35) 70%,rgba(0,0,0,0) 100%);
}
:root[data-theme="b"]{
  --bg:#0B0B0C;--card:rgba(255,255,255,.05);--card2:rgba(255,255,255,.07);--ink:#FCFCFC;--muted:#8A8A8E;--line:rgba(255,255,255,.10);
  --track:#3A3A3D;--rose:#232325;--acc:#F2F2F2;--acc2:#BDBDC2;--on-acc:#0B0B0C;--chipbg:rgba(255,255,255,.05);--chipink:#8A8A8E;--done:#F2F2F2;
  --surface:#232325;--a:242,242,242;--a2:189,189,194;--sheet:#1A1A1C;--bg2:#070708;--ktrack:#3A3A3D;--glow:radial-gradient(55% 60% at 12% 22%,rgba(255,255,255,.10) 0%,rgba(255,255,255,.05) 35%,rgba(255,255,255,.02) 70%,rgba(0,0,0,0) 100%);
  --mchip-onfg:#fff;--mchip-onbase:rgba(255,255,255,.32);
}
:root[data-theme="f"]{
  --bg:#050505;--card:rgba(8,8,8,.82);--card2:rgba(8,8,8,.9);--ink:#F4F4F2;--muted:#8C8C88;--line:rgba(255,255,255,.13);
  --track:#262626;--rose:#111111;--acc:#F8561C;--acc2:#FA844D;--on-acc:#050505;--chipbg:rgba(8,8,8,.82);--chipink:#8C8C88;--done:#F8561C;
  --font-num:"JetBrains Mono","Barlow Condensed",monospace;
  --surface:#111111;--a:248,86,28;--a2:250,132,77;--warn:#FFD24A;--warnl:rgba(255,210,74,.4);--sheet:#0C0C0C;--bg2:#000000;--ktrack:#262626;
  --num:'JetBrains Mono',monospace;--glow:none;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;background:#0b0b0c}
body{margin:0;height:100%;background:#0b0b0c;color:var(--ink);font-family:var(--font);font-weight:500;-webkit-tap-highlight-color:transparent;display:flex;align-items:center;justify-content:center;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,[role=button]:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input[type=range]{accent-color:var(--acc);width:100%;margin-bottom:16px}

/* ===== макет iPhone 15 Pro ===== */
.stage{transform:scale(var(--s,1));transform-origin:center}
.phone{position:relative;width:414px;height:868px;border-radius:58px;padding:12px;
  background:linear-gradient(145deg,#3a3c40,#16171a 40%,#2b2d31);
  box-shadow:0 0 0 2px #0b0b0c,0 40px 90px rgba(0,0,0,.7),inset 0 0 2px rgba(255,255,255,.25)}
.phone::before,.phone::after{content:"";position:absolute;width:4px;border-radius:2px;background:#2a2c30}
.phone::before{left:-4px;top:170px;height:60px;box-shadow:0 80px 0 #2a2c30}
.phone::after{right:-4px;top:220px;height:95px}
.screen{position:relative;width:100%;height:100%;border-radius:46px;overflow:hidden;background:#000}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:36px;border-radius:20px;background:#000;z-index:6}
.status{position:absolute;top:0;left:0;right:0;height:54px;z-index:5;
  display:flex;align-items:center;justify-content:space-between;padding:6px 32px 0 40px;
  font-weight:600;font-size:16px;color:#fff;font-family:-apple-system,"SF Pro Display",Manrope,sans-serif}
.status i{display:inline-flex;gap:6px;align-items:center;font-style:normal}
.bars{display:flex;gap:2px;align-items:flex-end}
.bars b{width:3px;background:#fff;border-radius:1px;display:block}
.batt{width:25px;height:12px;border:1.5px solid rgba(255,255,255,.5);border-radius:4px;padding:1px}
.batt::after{content:"";display:block;width:70%;height:100%;background:#fff;border-radius:1.5px}
.home-ind{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:rgba(255,255,255,.85);z-index:7;pointer-events:none}
.bgbtn{position:absolute;top:75px;right:16px;z-index:4;width:36px;height:36px;border-radius:50%;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:#fff;font-size:15px;
  display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px)}

/* ===== фоновая подложка: растянута на всю высоту скролла, ауреолы сверху/снизу, центр — просто тёмный ===== */
.app-bg{position:absolute;top:0;left:0;right:0;z-index:0;background:var(--bg);overflow:hidden;pointer-events:none}
.bg-fixed{position:absolute;inset:0;z-index:0;display:none;pointer-events:none}.bg-fixed.on{display:block}
.app-bg.fixedbg{background:transparent!important}
.app-bg.photoraw .bg-shade,.app-bg.photoraw .bg-grain{display:none!important}
.app-bg.photodim .bg-shade,.app-bg.photodim .bg-grain{display:block!important}
#appcontent{position:relative;z-index:1}
.bg-layer{position:absolute;inset:0;transition:none}
.bg-light{position:absolute;top:-160px;left:-12%;right:-12%;height:560px;
  background:
    radial-gradient(55% 60% at 12% 22%,rgba(118,168,52,.95) 0%,rgba(84,128,36,.70) 35%,rgba(50,80,24,.35) 70%,transparent 100%),
    linear-gradient(51deg,transparent 0%,transparent 48%,rgba(46,72,22,.55) 58%,rgba(58,92,28,.70) 68%,rgba(14,22,8,.35) 75%,rgba(0,0,0,0) 79.5%,rgba(78,122,36,.80) 85%,rgba(92,142,42,.85) 87%,rgba(52,82,26,.50) 91%,transparent 97%);
  filter:blur(24px);
  -webkit-mask-image:linear-gradient(to bottom,#000 0%,#000 34%,rgba(0,0,0,.45) 58%,transparent 86%);
  mask-image:linear-gradient(to bottom,#000 0%,#000 34%,rgba(0,0,0,.45) 58%,transparent 86%);
}
.bg-aura{position:absolute;bottom:-160px;left:-12%;right:-12%;height:560px;
  background:
    radial-gradient(45% 55% at 92% 78%,rgba(84,128,36,.45) 0%,rgba(46,72,22,.25) 45%,transparent 100%),
    linear-gradient(125deg,transparent 0%,transparent 70%,rgba(46,72,22,.25) 75%,rgba(78,122,36,.45) 79%,rgba(88,136,40,.50) 80.5%,rgba(46,72,22,.25) 84%,transparent 89%);
  filter:blur(26px);
  -webkit-mask-image:linear-gradient(to top,#000 0%,#000 34%,rgba(0,0,0,.5) 58%,transparent 86%);
  mask-image:linear-gradient(to top,#000 0%,#000 34%,rgba(0,0,0,.5) 58%,transparent 86%);
}
:root[data-theme="p"] .bg-light{background:
    radial-gradient(55% 60% at 12% 22%,rgba(214,92,142,.95) 0%,rgba(170,60,110,.70) 35%,rgba(100,30,64,.35) 70%,transparent 100%),
    linear-gradient(51deg,transparent 0%,transparent 48%,rgba(80,26,50,.55) 58%,rgba(120,40,76,.70) 68%,rgba(30,10,18,.35) 75%,rgba(0,0,0,0) 79.5%,rgba(150,60,100,.80) 85%,rgba(180,80,120,.85) 87%,rgba(90,30,56,.50) 91%,transparent 97%)}
:root[data-theme="p"] .bg-aura{background:
    radial-gradient(45% 55% at 92% 78%,rgba(170,60,110,.45) 0%,rgba(100,30,64,.25) 45%,transparent 100%),
    linear-gradient(125deg,transparent 0%,transparent 70%,rgba(100,30,64,.25) 75%,rgba(150,60,100,.45) 79%,rgba(180,80,120,.50) 80.5%,rgba(100,30,64,.25) 84%,transparent 89%)}
:root[data-theme="b"] .bg-light{background:radial-gradient(60% 60% at 15% 20%,rgba(255,255,255,.10) 0%,rgba(255,255,255,.05) 45%,transparent 100%)}
:root[data-theme="b"] .bg-aura{background:radial-gradient(50% 55% at 90% 80%,rgba(255,255,255,.06) 0%,rgba(255,255,255,.02) 45%,transparent 100%)}
:root[data-theme="f"] .bg-light,:root[data-theme="f"] .bg-aura{display:none}
:root[data-theme="f"] .bg-grid{display:block}
.bg-grid{display:none;position:absolute;inset:0;
  background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);
  background-size:39px 39px;
}
.bg-grid::before{content:"";position:absolute;top:12%;left:8%;width:120px;height:120px;border-radius:50%;border:1px dashed rgba(248,86,28,.28)}
.bg-grid::after{content:"";position:absolute;bottom:16%;right:10%;width:80px;height:80px;border:1px dashed rgba(250,132,77,.24);transform:rotate(12deg)}
.bg-shade{position:absolute;inset:0;background:linear-gradient(90deg,transparent 55%,rgba(0,0,0,.5) 100%)}
.bg-grain{position:absolute;inset:0;opacity:.45;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.95' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  background-size:180px 180px;
}

.app{position:relative;z-index:1;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;max-width:390px;margin:0 auto;padding:64px 16px 112px;box-sizing:border-box}
.top{display:flex;align-items:center;gap:12px}
.ava{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--wine),var(--wine3));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;border:1px solid var(--line);flex:none;overflow:hidden;padding:0}
.ava img{width:100%;height:100%;object-fit:cover;display:block}
.hi{flex:1;min-width:0}
.hi .h1{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hi .h2{font-weight:800;font-size:19px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:22px 0 12px}
.sec-h h3{margin:0;font-size:20px;font-weight:800}
.sec-h .val{font-weight:800;color:var(--acc);font-size:14px}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;margin-top:14px}
.days::-webkit-scrollbar{display:none}
.day{flex:none;width:54px;padding:12px 0;border-radius:20px;background:var(--card);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);border:1px solid var(--line);text-align:center;color:var(--muted);font-size:12px;font-weight:700}
.day b{display:block;font-size:15px;color:var(--ink);margin-top:3px;font-weight:800}
.day.on{background:var(--ink);color:var(--wine3);border-color:var(--ink)}
.day.on b{color:var(--wine3)}
.day2{flex:none;width:44px;display:flex;flex-direction:column;align-items:center;gap:7px;color:var(--muted);font-size:12px;font-weight:700}
.day2 .dot{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:var(--muted);background:transparent}
.day2.done .dot{background:var(--acc);color:var(--on-acc)}
.day2.on{color:var(--ink)}
.day2.on .dot{background:var(--ink);color:var(--wine3);width:40px;height:52px;border-radius:22px}
.banner{margin-top:16px;display:flex;align-items:center;gap:12px;background:var(--card2);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);border:1px solid var(--line);border-radius:20px;padding:15px}
.ring{width:26px;height:26px;border-radius:50%;border:2px solid var(--acc);flex:none}
.banner p{margin:0;font-size:13.5px;line-height:1.35;font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;margin-top:16px}
.chips::-webkit-scrollbar{display:none}
.mchip{flex:none;padding:10px 16px;border-radius:12px;background:var(--chipbg);border:1px solid var(--line);color:var(--chipink);font-weight:800;font-size:12.5px;text-transform:uppercase;letter-spacing:.02em}
.mchip.on{background:var(--acc-grad);color:var(--on-acc);border-color:transparent}
.mlist{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.mtile{position:relative;height:318px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;border-radius:22px;overflow:hidden;border:1px solid color-mix(in srgb,var(--acc) 35%,transparent);padding:16px}
.mtile.done{border-color:var(--done)}
.mphoto{position:absolute;inset:0;z-index:0;padding:0;width:100%;height:100%;text-align:left}
.mphoto img,.mphoto svg{width:100%;height:100%;object-fit:cover;display:block}
.mtop-fade{position:absolute;top:0;left:0;right:0;height:55%;z-index:1;background:linear-gradient(to bottom,rgba(15,16,18,.72) 0%,rgba(15,16,18,.35) 55%,rgba(15,16,18,0) 100%)}
.mfull-fade{position:absolute;inset:0;z-index:1;background:linear-gradient(to top,rgba(15,16,18,.96) 0%,rgba(15,16,18,.8) 30%,rgba(15,16,18,.25) 60%,rgba(15,16,18,0) 80%)}
.mrow-top{position:relative;z-index:2;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.mleft2{min-width:0;display:flex;flex-direction:column;text-shadow:0 1px 8px rgba(0,0,0,.45)}
.mgrp{color:rgba(252,252,252,.72);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;line-height:16px}
.mname{font-family:var(--font-num);font-weight:700;font-size:21px;text-transform:uppercase;letter-spacing:.01em;line-height:24px;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mwt{font-family:var(--font-num);font-weight:700;font-size:38px;line-height:1;color:var(--acc);display:flex;align-items:baseline;gap:4px;text-shadow:0 1px 10px rgba(0,0,0,.4);margin-top:4px}
.mwt small{font-size:14px;color:var(--muted);font-weight:600}
.repsbox{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:6px}
.repsnums{display:flex;align-items:center;gap:6px}
.repsnums span{background:rgba(42,43,47,.78);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);min-width:36px;height:36px;padding:0 4px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px;color:var(--ink)}
.repsnums .sep{background:none;color:var(--muted);font-weight:600;min-width:auto}
.repslbl{color:rgba(252,252,252,.6);font-size:11px;font-weight:700;white-space:nowrap}
.mrow-bottom{position:relative;z-index:2;display:flex;flex-direction:column;gap:10px}
.mrecord{display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:700;color:rgba(252,252,252,.7);min-height:16px}
.mrecord .dot{width:3px;height:3px;border-radius:50%;background:rgba(252,252,252,.4)}
.mtr.up{color:var(--acc2)}
.mrecv.on{color:var(--acc)}
.mbottom{display:flex;align-items:center;justify-content:space-between;gap:12px}
.mstart{width:152px;min-height:46px;flex:none;background:var(--acc-grad);color:var(--on-acc);font-weight:800;font-size:13.5px;text-align:center;border-radius:999px}
.mdone{flex:none;width:46px;height:46px;border-radius:50%;border:1.5px solid rgba(252,252,252,.14);background:rgba(255,255,255,.06);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;font-size:18px;color:rgba(252,252,252,.7)}
.mdone.on{border-color:transparent;color:var(--on-acc);background:var(--acc-grad);box-shadow:inset 0 1.5px 1px rgba(255,255,255,.7),inset 0 -2px 4px rgba(0,0,0,.2),0 8px 22px rgba(0,0,0,.3);backdrop-filter:blur(14px) saturate(180%);-webkit-backdrop-filter:blur(14px) saturate(180%)}
.hgroup{margin-top:18px}
.hday{color:var(--muted);font-size:12.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px}
.hrow{display:flex;align-items:center;gap:12px;background:var(--card);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:8px}
.hic{flex:none;width:34px;height:34px;border-radius:50%;background:var(--acc-grad);color:var(--on-acc);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800}
.hinfo{flex:1;min-width:0}
.hname{font-weight:800;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hsub{color:var(--muted);font-size:12px;font-weight:600;margin-top:2px}
.hwt{font-family:var(--font-num);font-weight:700;font-size:20px;color:var(--acc);display:flex;align-items:baseline;gap:3px;flex:none}
.hwt small{font-size:12px;color:var(--muted);font-weight:600}
.hempty{margin-top:40px;text-align:center;color:var(--muted);font-size:13.5px;line-height:1.5}
.kring{position:relative;width:150px;height:150px;margin:10px auto 4px;cursor:pointer}
.kring svg{width:100%;height:100%}
.kring-mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2px;pointer-events:none}
.kring-mid b{font-family:var(--font-num);font-size:32px;font-weight:700;color:var(--ink)}
.kring-mid small{font-size:11px;color:var(--muted);font-weight:700}
.kring-mid em{font-style:normal;font-size:10.5px;color:var(--acc);font-weight:800;margin-top:2px}
.macrorow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:18px}
.mbar{background:var(--card);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);border:1px solid var(--line);border-radius:16px;padding:11px 12px;min-width:0}
.mbar-top{display:flex;align-items:baseline;gap:3px;font-size:11px;color:var(--muted);font-weight:700;flex-wrap:wrap}
.mbar-top span{color:var(--ink);font-weight:800;font-size:12px;margin-right:auto}
.mbar-top b{font-family:var(--font-num);color:var(--ink);font-size:15px;font-weight:700}
.mbar-track{height:6px;border-radius:3px;background:var(--track);margin-top:8px;overflow:hidden}
.mbar-track i{display:block;height:100%;background:var(--acc-grad);border-radius:3px}
.foodactions{display:flex;gap:10px;margin-top:18px}
.factbtn{flex:1;text-align:center;padding:13px 0;border-radius:999px;background:var(--acc-grad);color:var(--on-acc);font-weight:800;font-size:13.5px;cursor:pointer}
.factbtn.alt{background:none;border:1.5px solid var(--line);color:var(--ink)}
.fthumb{flex:none;width:34px;height:34px;border-radius:10px;object-fit:cover}
.hrow.food{cursor:pointer}

@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}

.addm{min-height:96px;border-radius:22px;border:1.5px dashed var(--wine);color:var(--acc);font-weight:700;display:grid;place-items:center;font-size:13.5px}
.stat3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:16px}

.strikday i{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-style:normal;border:1px solid var(--line);background:var(--rose);color:transparent;font-size:12px}
.strikday.on i{background:var(--acc);color:var(--on-acc);border-color:transparent}
.strikday.today i{border-color:var(--acc)}
.scrpage.settscr{gap:26px}
.scrpage.achscr{gap:20px}
.settsec{display:flex;flex-direction:column;gap:12px}
.setth{display:flex;justify-content:space-between;align-items:baseline}
.settsec h2{margin:0;font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.setth span{font-size:12.5px;color:var(--muted);font-weight:600}
.settcard{border-radius:20px;background:var(--card);border:1px solid var(--line)}
.settthemes{background:var(--card);border:1px solid var(--line);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:18px 6px;border-radius:24px}
.settbgs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.bgtile{position:relative;display:block;height:124px;border-radius:18px;overflow:hidden;padding:0;border:1px solid rgba(252,252,252,.1);cursor:pointer}
.bgtile.on{border:2px solid var(--acc)}
.bgtile .ck{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;display:none;align-items:center;justify-content:center;background:var(--acc);color:var(--bg)}
.bgtile.on .ck{display:flex}
.bgtile .nm{position:absolute;left:8px;bottom:7px;font-size:11.5px;font-weight:800;color:#FCFCFC;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.bgup{height:124px;box-sizing:border-box;border-radius:18px;border:1.5px dashed rgba(252,252,252,.2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--acc);font-size:12px;font-weight:800;text-align:center;cursor:pointer}
.settdim{background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px;padding:14px 16px;border-radius:18px}
.settdim .r{display:flex;justify-content:space-between;font-size:13.5px;font-weight:700}
.settdim .r span+span{color:var(--muted)}
.settdim input[type=range]{margin:2px 0;padding:0;border:0;border-radius:0;background:none;width:100%;accent-color:var(--acc)}
.settdim small{font-size:12px;color:var(--muted);line-height:1.4}
.settgroup{border-radius:20px;background:var(--card);border:1px solid var(--line);overflow:hidden}
.settbtn{width:100%;box-sizing:border-box;min-height:54px;padding:0 16px;border:0;border-bottom:1px solid rgba(252,252,252,.06);background:transparent;color:var(--ink);display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:700;text-align:left}
.settgroup .settbtn:last-child{border-bottom:0}
.settbtn.acc{color:var(--acc);justify-content:flex-start}
.settbtn.tall{min-height:58px;padding:0 14px 0 16px;gap:12px;border-bottom:0}
.settbtn.bt{border-top:1px solid rgba(252,252,252,.06)}
.settval{display:flex;align-items:center;gap:6px;color:var(--muted);font-weight:700}
.settrow{min-height:58px;padding:0 14px 0 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.settlead{display:flex;align-items:center;gap:12px;font-size:15px;font-weight:700}
.settic{width:34px;height:34px;flex-shrink:0;border-radius:11px;background:rgba(252,252,252,.06);color:var(--acc);display:flex;align-items:center;justify-content:center}
.settlbl{display:flex;flex-direction:column;align-items:flex-start;gap:2px;font-size:15px;font-weight:700}
.settlbl small{font-size:12px;color:var(--muted);font-weight:600}
.unitseg{display:flex;padding:3px;border-radius:999px;background:var(--bg);border:1px solid rgba(252,252,252,.08)}
.unitseg button{height:38px;min-width:52px;padding:0 14px;border:0;border-radius:999px;font-size:13.5px;font-weight:800;background:transparent;color:var(--muted)}
.unitseg button.on{background:var(--acc);color:var(--on-acc)}
.unithint{padding:0 16px 12px 62px;font-size:12.5px;color:var(--muted);font-weight:600}
.swtc{width:50px;height:30px;flex-shrink:0;border-radius:15px;padding:3px;box-sizing:border-box;display:flex;background:var(--track)}
.swtc.on{background:var(--acc);justify-content:flex-end}
.swtc i{width:24px;height:24px;border-radius:50%;background:var(--muted);display:block;font-style:normal}
.swtc.on i{background:var(--on-acc)}
.rembody{padding:0 16px 14px}
.remdays{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.remday{height:44px;border-radius:12px;font-size:12.5px;font-weight:800;border:1px solid rgba(252,252,252,.1);background:transparent;color:var(--muted)}
.remday.on{border:0;background:var(--acc);color:var(--on-acc)}
.remtrow{margin-top:10px;display:flex;align-items:center;justify-content:space-between}
.remtrow>span{font-size:13.5px;font-weight:700;color:var(--muted)}
.remtrow>div{display:flex;gap:6px}
.remtime{height:40px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:800;border:1px solid rgba(252,252,252,.1);background:transparent;color:var(--ink)}
.remtime.on{border:0;background:var(--acc);color:var(--on-acc)}
.remhint{margin-top:10px;font-size:12.5px;color:var(--muted);font-weight:600}
.settdata{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.settdata .hd{display:flex;align-items:center;gap:12px}
.settdata .hd>span+span{display:flex;flex-direction:column;gap:2px;font-size:15px;font-weight:700}
.settdata .hd small{font-size:12px;color:var(--muted);font-weight:600}
.expfmts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.expfmt{height:44px;border-radius:14px;font-size:13.5px;font-weight:800;border:1px solid rgba(252,252,252,.1);background:transparent;color:var(--muted)}
.expfmt.on{border:1.5px solid var(--acc);background:rgba(252,252,252,.04);color:var(--ink)}
.expbtn{height:52px;border-radius:999px;font-size:14.5px;font-weight:800;border:0;background:var(--acc);color:var(--on-acc)}
.expbtn.done{border:1px solid var(--acc);background:transparent;color:var(--acc)}
.settver{text-align:center;font-size:12px;color:var(--muted);font-weight:600}
.achsum{display:flex;align-items:center;gap:16px;padding:18px;border-radius:24px;background:var(--card);border:1px solid var(--line)}
.achsum .tx{display:flex;flex-direction:column;gap:4px}
.achsum .tx b{font-size:17px;font-weight:800}
.achsum .tx span{font-size:13px;line-height:1.4;color:var(--muted)}
.achring{width:84px;height:84px;flex-shrink:0;border-radius:50%;display:flex;align-items:center;justify-content:center}
.achring .in{width:68px;height:68px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center}
.achring .in b{font-family:var(--font-num);font-size:28px;font-weight:700;line-height:1}
.achring .in b small{font-size:16px;color:var(--muted)}
.achfilters{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:0 16px;scrollbar-width:none}
.achfilters::-webkit-scrollbar{display:none}
.achf{flex-shrink:0;height:40px;padding:0 12px 0 16px;border-radius:12px;display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--muted)}
.achf.on{background:var(--acc-grad);color:var(--on-acc);border-color:transparent}
.achf b{min-width:22px;height:22px;padding:0 6px;box-sizing:border-box;border-radius:11px;font-size:12px;font-weight:800;background:rgba(252,252,252,.08);color:var(--ink);display:flex;align-items:center;justify-content:center}
.achf.on b{background:rgba(15,16,18,.18);color:inherit}
.achgroup{display:flex;flex-direction:column;gap:8px}
.achgh{display:flex;align-items:baseline;justify-content:space-between;padding:6px 2px 2px}
.achgh h2{margin:0;font-size:16px;font-weight:800}
.achgh span{font-size:12.5px;font-weight:700;color:var(--muted)}
.achrow{display:flex;align-items:center;gap:12px;padding:12px 14px 12px 12px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.achrow.done{background:color-mix(in srgb,var(--acc) 6%,transparent);border-color:color-mix(in srgb,var(--acc) 30%,transparent)}
.achrow.locked{opacity:.55}
.achmedal{width:48px;height:48px;flex-shrink:0;box-sizing:border-box;border-radius:50%;background:var(--acc-grad);color:var(--on-acc);display:flex;align-items:center;justify-content:center;font-family:var(--font-num);font-weight:700;font-size:17px;line-height:1}
.achmedal.sm{font-size:13px}
.achmedal.pring>span{width:40px;height:40px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--ink)}
.achmedal.lock{background:var(--rose);color:var(--muted);border:1.5px dashed rgba(252,252,252,.2)}
.achinfo{flex-grow:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.achinfo b{font-size:14.5px;font-weight:800;line-height:1.25}
.achinfo>span{font-size:12px;line-height:1.35;color:var(--muted);font-weight:600}
.achbar{display:flex;align-items:center;gap:8px;margin-top:4px}
.achbar div{flex-grow:1;height:5px;border-radius:3px;background:var(--track);overflow:hidden}
.achbar div i{display:block;height:100%;border-radius:3px;background:var(--acc2)}
.achbar span{font-size:11.5px;font-weight:700;color:var(--ink);white-space:nowrap}
.achdone{flex-shrink:0;font-size:11.5px;font-weight:700;color:var(--acc);white-space:nowrap}

.obov{position:absolute;inset:0;z-index:80;display:none;background:var(--bg)}
.obov.on{display:flex}
.obscr{position:relative;height:100%;width:100%;box-sizing:border-box;display:flex;flex-direction:column;padding:60px 20px 34px;overflow-y:auto}
.obtop{display:flex;align-items:center;gap:12px}
.obback{width:44px;height:44px;flex-shrink:0;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);display:flex;align-items:center;justify-content:center}
.obprog{flex-grow:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.obprog i{height:5px;border-radius:3px;background:var(--line);display:block;font-style:normal}
.obprog i.on{background:var(--acc)}
.obskip{height:44px;flex-shrink:0;padding:0 4px 0 8px;display:flex;align-items:center;font-size:14px;font-weight:700;color:var(--ink);opacity:.8;background:none}
.oblang{flex-shrink:0;display:flex;padding:3px;border-radius:999px;background:var(--card2);border:1px solid var(--line)}
.oblang button{height:40px;min-width:44px;padding:0 12px;border:0;border-radius:999px;font-size:12px;font-weight:800;letter-spacing:.04em;color:var(--muted);background:none}
.oblang button.on{background:var(--ink);color:var(--bg)}
.obh1{margin:28px 0 0;font-size:30px;line-height:1.15;font-weight:800;color:var(--ink)}
.obp{margin:8px 0 0;font-size:14.5px;line-height:1.45;color:var(--muted)}
.obgrid2{margin-top:22px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.obgcard{position:relative;height:196px;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--ink);background:var(--card);border:1.5px solid var(--line)}
.obgcard.on{background:color-mix(in srgb,var(--acc) 8%,transparent);border-color:var(--acc)}
.obgcard .av{width:104px;height:104px;border-radius:50%;overflow:hidden;box-sizing:border-box;border:3px solid var(--line);opacity:.75;display:flex;align-items:center;justify-content:center;font-size:38px}
.obgcard .av img{width:100%;height:100%;object-fit:cover;display:block}
.obgcard.on .av{border-color:var(--acc);box-shadow:0 0 0 6px color-mix(in srgb,var(--acc) 15%,transparent),0 10px 30px color-mix(in srgb,var(--acc) 20%,transparent);opacity:1}
.obgcard .chk{position:absolute;top:12px;right:12px;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--line);color:transparent}
.obgcard.on .chk{background:var(--acc);color:var(--on-acc);border-color:transparent}
.obnick{margin-top:22px;display:flex;flex-direction:column;gap:8px}
.obnick .lblrow{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--muted)}
.obnick input{height:56px;box-sizing:border-box;padding:0 18px;border-radius:18px;border:1.5px solid color-mix(in srgb,var(--acc) 45%,transparent);background:var(--rose);color:var(--ink);font:inherit;font-size:18px;font-weight:700;margin:0}
.obcard{margin-top:22px;padding:16px;border-radius:24px;background:var(--card);border:1px solid var(--line)}
.obcard>span{font-size:13px;font-weight:700;color:var(--muted)}
.obwrow{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.obwbtn{width:56px;height:56px;border-radius:50%;background:var(--rose);color:var(--acc);border:1px solid var(--line);font-size:28px;font-weight:600}
.obwbtn.pl{background:var(--acc-grad);color:var(--on-acc);border:0}
.obwnum{text-align:center;font-family:var(--font-num);font-weight:700;font-size:72px;line-height:.9;color:var(--acc)}
.obwnum small{font-size:22px;color:var(--muted)}
.obgoal{margin-top:8px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.obgbtn{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:14px;border-radius:22px;text-align:left;color:var(--ink);background:var(--card);border:1.5px solid var(--line)}
.obgbtn.on{background:color-mix(in srgb,var(--acc) 8%,transparent);border-color:var(--acc)}
.obgbtn .ic2{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:4px;background:var(--rose);color:var(--muted)}
.obgbtn.on .ic2{background:var(--acc);color:var(--on-acc)}
.obgbtn b{font-size:16px;font-weight:800}
.obgbtn em{font-style:normal;font-size:12px;color:var(--muted);font-weight:600}
.obtarget{margin-top:12px;display:flex;align-items:center;gap:12px;padding:12px 12px 12px 16px;border-radius:20px;background:var(--card);border:1px solid var(--line)}
.obtarget .info{flex-grow:1;display:flex;flex-direction:column;gap:2px}
.obtarget .info span:first-child{font-size:12.5px;font-weight:700;color:var(--muted)}
.obtarget .info b{font-family:var(--font-num);font-weight:700;font-size:30px;line-height:1;color:var(--ink)}
.obtarget .info b small{font-size:14px;color:var(--muted)}
.obtarget .info em{font-style:normal;font-size:12px;font-weight:700;color:var(--acc2)}
.obtarget button{width:44px;height:44px;border-radius:50%;background:var(--rose);color:var(--ink);border:1px solid var(--line);font-size:20px}
.obthemes{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap}
.obfoot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding-top:20px}
.obnext{display:block;width:100%;box-sizing:border-box;padding:17px;border-radius:999px;background:var(--acc-grad);color:var(--on-acc);font-weight:800;font-size:16px;text-align:center;border:0}
.obnext[disabled]{background:var(--track);color:var(--muted)}
.obfoot .obskip2{height:48px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--ink);font-size:15px;font-weight:700;background:none;border:0}
.obfoot .obcap{text-align:center;font-size:12px;color:var(--muted);font-weight:600}

/* ===== workout screens (C-Main / Machine / AddMachine / PR / Undo) ===== */
.wdays{display:flex;gap:6px;justify-content:space-between}
.wday{flex:1;min-width:0;height:64px;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0;background:transparent;color:var(--ink);border:1px solid color-mix(in srgb,var(--ink) 14%,transparent)}
.wday .dn{font-size:12px;font-weight:500;opacity:.8}
.wday .dd{font-size:17px;font-weight:700}
.wday .ddot{width:5px;height:5px;border-radius:50%;background:transparent;display:block}
.wday .ddot.has{background:var(--acc)}
.wday.on .ddot{background:currentColor}
.wday.fut{opacity:.35}
.wday.on{background:var(--acc);color:var(--on-acc);border-color:transparent}
.chips{margin:16px -16px 0;padding:0 16px 2px}
.mchip{height:40px;padding:0 14px 0 9px;display:flex;align-items:center;gap:7px}
.mchip svg{flex:none;display:block}
.phg{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.mphoto .phg svg{width:120px;height:36px}
.mdone svg{display:block}
.mtile.restored{box-shadow:0 0 0 2px color-mix(in srgb,var(--acc2) 50%,transparent)}
/* machine sheet */
.sheet.msheet{--sbg:#141517;padding:0;height:calc(100% - 44px);max-height:calc(100% - 44px);display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden}
.mhero{position:relative;height:248px;flex-shrink:0}
.mhero-ph{position:absolute;inset:0;background:radial-gradient(70% 60% at 50% 40%,color-mix(in srgb,var(--acc) 16%,transparent) 0%,transparent 70%),linear-gradient(160deg,var(--track) 0%,var(--rose) 60%,#141416 100%);display:flex;align-items:center;justify-content:center;padding-bottom:40px;box-sizing:border-box;color:var(--acc)}
.mhero-ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.mhero-fade{position:absolute;inset:0;background:linear-gradient(to top,var(--sbg) 0%,color-mix(in srgb,var(--sbg) 85%,transparent) 26%,color-mix(in srgb,var(--sbg) 20%,transparent) 62%,transparent 80%)}
.mhero-grab{position:absolute;top:8px;left:50%;width:40px;height:4px;margin-left:-20px;border-radius:2px;background:rgba(252,252,252,.35)}
.mhero-top{position:absolute;top:18px;left:16px;right:16px;display:flex;justify-content:space-between}
.mhbtn{height:44px;padding:0 16px 0 13px;border-radius:999px;display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;color:#fff;cursor:pointer;background:linear-gradient(160deg,rgba(255,255,255,.26) 0%,rgba(255,255,255,.08) 55%,rgba(255,255,255,.14) 100%);border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(16px) saturate(180%);-webkit-backdrop-filter:blur(16px) saturate(180%);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 6px 18px rgba(0,0,0,.35)}
.mhbtn.mhx{width:44px;padding:0;justify-content:center;border-radius:50%}
.mhero-info{position:absolute;left:20px;right:20px;bottom:14px;display:flex;flex-direction:column;gap:4px}
.mgpill{align-self:flex-start;height:26px;padding:0 10px;border-radius:999px;display:flex;align-items:center;font-size:11.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,transparent);border:1px solid color-mix(in srgb,var(--acc) 35%,transparent)}
.mhero-info h2{margin:4px 0 0;font-size:28px;line-height:1.1;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mlast{font-size:13px;font-weight:600;color:var(--muted)}
.msbody{padding:6px 18px 30px;display:flex;flex-direction:column;flex-grow:1}
.msheet .big,.addsheet .big{margin:8px 0 4px}
.bigmid{text-align:center;display:flex;flex-direction:column;align-items:center}
.wdelta{margin-top:6px;font-size:12.5px;font-weight:800;color:var(--muted)}
.wdelta.up{color:var(--acc2)}
.steprow{display:flex;align-items:center;gap:10px;margin:14px 0 16px}
.steprow>span{font-size:13px;font-weight:700;color:var(--muted);flex-shrink:0}
.stepgrid{flex-grow:1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.stepbtn{height:44px;border-radius:14px;font-size:14px;font-weight:800;border:1px solid rgba(252,252,252,.1);background:transparent;color:var(--ink)}
.stepbtn.on{background:var(--acc-grad);color:var(--on-acc);border-color:transparent}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.row2 .box{display:block;border-radius:20px;padding:12px}
.row2 .box em{font-size:12.5px;font-weight:700;color:var(--muted);line-height:22px}
.row2 .mini{width:44px;height:44px;background:var(--bg);border:1px solid rgba(252,252,252,.1);color:var(--ink);font-size:20px}
.row2 .box b{font-family:var(--font-num);font-size:32px;font-weight:700}
.msheet .box{background:rgba(252,252,252,.03);border:1px solid rgba(252,252,252,.08);backdrop-filter:none;-webkit-backdrop-filter:none}
.donerow{margin-top:12px;width:100%;min-height:64px;padding:10px 14px;border-radius:20px;display:flex;align-items:center;gap:12px;color:var(--ink);background:rgba(252,252,252,.03);border:1.5px solid rgba(252,252,252,.08)}

  box-shadow:0 0 0 1.5px color-mix(in srgb,var(--acc) 45%,transparent) inset,0 0 0 7px color-mix(in srgb,var(--acc) 11%,transparent),0 0 0 15px color-mix(in srgb,var(--acc) 6%,transparent),0 0 0 23px color-mix(in srgb,var(--acc) 3%,transparent);
  animation:apicpulse 2.6s ease-in-out infinite}

  0%,100%{box-shadow:0 0 0 1.5px color-mix(in srgb,var(--acc) 45%,transparent) inset,0 0 0 7px color-mix(in srgb,var(--acc) 11%,transparent),0 0 0 15px color-mix(in srgb,var(--acc) 6%,transparent),0 0 0 23px color-mix(in srgb,var(--acc) 3%,transparent)}
  50%{box-shadow:0 0 0 1.5px color-mix(in srgb,var(--acc) 60%,transparent) inset,0 0 0 9px color-mix(in srgb,var(--acc) 14%,transparent),0 0 0 18px color-mix(in srgb,var(--acc) 8%,transparent),0 0 0 27px color-mix(in srgb,var(--acc) 3%,transparent)}
}

.addphoto b{font-size:14px;font-weight:800;color:var(--ink)}

.proh h2{margin:0;font-size:20px;font-weight:800}
.proh>span{font-size:13px;color:var(--muted);font-weight:700}
.proall{height:38px;padding:0 8px 0 14px;border-radius:999px;border:1px solid color-mix(in srgb,var(--acc) 45%,transparent);color:var(--acc);font-size:13px;font-weight:700;display:flex;align-items:center;gap:4px}
.achstrip{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:0 16px;scrollbar-width:none}
.achstrip::-webkit-scrollbar{display:none}
.achtile{flex-shrink:0;width:104px;display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 8px;border-radius:20px;text-align:center;box-sizing:content-box}
.achtile.done{background:color-mix(in srgb,var(--acc) 8%,transparent);border:1px solid color-mix(in srgb,var(--acc) 35%,transparent)}
.achtile.prog{background:var(--card);border:1px solid var(--line)}
.achtile .md{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-num);font-weight:700;font-size:16px;flex-shrink:0}
.achtile.done .md{background:linear-gradient(145deg,color-mix(in srgb,#fff 60%,var(--acc)) 0%,var(--acc) 55%,var(--acc2) 100%);color:var(--on-acc);box-shadow:inset 0 1.5px 1px rgba(255,255,255,.65),0 6px 16px color-mix(in srgb,var(--acc) 30%,transparent)}
.achtile .md.s{font-size:18px}
.achtile .md.xs{font-size:12.5px}
.peava img{font-size:12px}
.obback,.scrback,.scrgear{width:46px;height:46px}
.achtile .md>span{width:40px;height:40px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--ink)}
.achtile .t{font-size:12.5px;font-weight:800;line-height:1.25}
.achtile .st{font-size:11px;font-weight:700;color:var(--muted)}
.achtile.done .st{color:var(--acc)}
.prorec{display:flex;align-items:center;gap:12px;padding:10px 14px 10px 10px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.prorec .ic{position:relative;width:46px;height:46px;flex-shrink:0;border-radius:14px;background:var(--rose);display:flex;align-items:center;justify-content:center}
.prorec .tr{position:absolute;right:-4px;top:-4px;width:24px;height:24px;box-sizing:border-box;border-radius:50%;background:var(--acc);color:var(--on-acc);border:2px solid var(--bg);display:flex;align-items:center;justify-content:center}
.prorec .inf{flex-grow:1;min-width:0}
.prorec .inf b{display:block;font-weight:800;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prorec .inf span{display:block;color:var(--muted);font-size:12px;font-weight:600;margin-top:2px}
.prorec .val{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.prorec .val>div{font-family:var(--font-num);font-weight:700;font-size:22px;line-height:1;color:var(--acc)}
.prorec .val small{font-size:12px;color:var(--muted);font-weight:600}
.prolegend{display:flex;gap:14px;font-size:11.5px;font-weight:700;color:var(--muted)}
.prolegend span{display:flex;align-items:center;gap:6px}
.prolegend i{width:12px;height:6px;border-radius:3px;background:color-mix(in srgb,var(--ink) 22%,transparent)}
.prolegend i.a{background:var(--acc)}
.proworkcard{border-radius:20px;overflow:hidden;background:var(--card);border:1px solid var(--line)}
.pwg{display:flex;align-items:center;gap:10px;padding:12px 14px 6px}
.pwg .ic{width:34px;height:34px;flex-shrink:0;border-radius:10px;background:var(--rose);display:flex;align-items:center;justify-content:center}
.pwg b{flex-grow:1;font-size:12px;font-weight:800;color:var(--ink);text-transform:uppercase;letter-spacing:.05em}
.pwg>span:last-child{font-size:12px;font-weight:700;color:var(--acc2)}
.pwr{display:flex;flex-direction:column;gap:7px;padding:8px 14px 12px 58px}
.pwr .l1{display:flex;align-items:baseline;gap:8px}
.pwr .l1 b{flex-grow:1;font-size:14.5px;font-weight:700;min-width:0}
.pwr .l1 em{font-style:normal;font-size:12px;font-weight:700;color:var(--acc2)}
.pwr .l1 span{width:56px;text-align:right;font-family:var(--font-num);font-weight:700;font-size:20px;line-height:1}
.pwr .l1 span small{font-size:11px;color:var(--muted)}
.pwr .bar{display:flex;height:8px;border-radius:4px;background:var(--track);overflow:hidden}
.pwr .bar i{height:8px;background:color-mix(in srgb,var(--ink) 22%,transparent)}
.pwr .bar i.a{background:var(--acc);border-radius:0 4px 4px 0}
.pwr .cap{font-size:11.5px;color:var(--muted);font-weight:600}
.pwsep{height:1px;margin:0 14px;background:color-mix(in srgb,var(--ink) 6%,transparent)}
.pwmore{display:block;width:100%;height:48px;border:0;border-top:1px solid color-mix(in srgb,var(--ink) 6%,transparent);background:transparent;color:var(--acc);font-size:14px;font-weight:700}
/* profile edit */
#scrpage.pescr{gap:0;padding-bottom:34px}
#penick{height:54px;padding:0 16px;border-radius:16px;border:1.5px solid color-mix(in srgb,var(--acc) 45%,transparent);background:var(--rose);color:var(--ink);font-size:17px;font-weight:700;margin:0}
.pelbl{font-size:13px;font-weight:700;color:var(--muted)}
.peava{width:112px;height:112px;border-radius:50%;box-sizing:border-box;border:3px solid var(--acc);box-shadow:0 0 0 6px color-mix(in srgb,var(--acc) 12%,transparent);overflow:hidden;background:var(--rose);display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800}
.peava img{width:100%;height:100%;object-fit:cover;display:block}
.pecam{position:absolute;right:-4px;bottom:-4px;width:44px;height:44px;border-radius:50%;border:3px solid var(--bg);background:var(--acc);color:var(--on-acc);display:flex;align-items:center;justify-content:center;box-sizing:border-box;cursor:pointer}
.pegrid{margin-top:8px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pegcard{height:56px;border-radius:18px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:15px;font-weight:800;color:var(--ink);background:color-mix(in srgb,var(--ink) 3%,transparent);border:1.5px solid color-mix(in srgb,var(--ink) 8%,transparent)}
.pegcard.on{background:color-mix(in srgb,var(--acc) 10%,transparent);border-color:var(--acc)}
.pegcard img{width:32px;height:32px;border-radius:50%;object-fit:cover}
.pegoals{margin-top:8px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pegoal{height:48px;border-radius:16px;font-size:14px;font-weight:800;border:1px solid color-mix(in srgb,var(--ink) 10%,transparent);background:transparent;color:var(--ink)}
.pegoal.on{background:var(--acc-grad);color:var(--on-acc);border-color:transparent}
/* ===== Питание (КБЖУ) — новый раздел, 1:1 с холстом «КБЖУ — было / стало» (Main / EmptyDay / PastDay) ===== */
.kn{display:flex;flex-direction:column;gap:20px;color:var(--ink)}
.kn button{font-family:inherit}
.kn .top{gap:12px}
.kn .ava{width:48px;height:48px}
.kn .wdays{align-items:flex-start}
.kn .wday.lk{height:66px}
.kn .wday.tdy{height:67px}
.kpst .wday:not(.tdy) .ddot.has{background:currentColor}
.kn-streak{height:38px;padding:0 12px;border-radius:999px;background:rgba(252,252,252,.05);border:1px solid rgba(252,252,252,.08);display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--ink);flex:none}
.kn-streak svg{color:var(--acc)}
.kn-streak .kn-n{font-family:var(--num);font-size:17px;font-weight:700}
.wday.dis{opacity:.6;cursor:default}
.wday .ddot.nod{background:transparent!important}
.wday.tdy{color:var(--acc);border:1.5px solid rgba(var(--a),.6)}
.wday.tdy .ddot{background:var(--acc)}
.wday.tdy .ddot.nod{background:transparent!important}
.kn-card{display:flex;flex-direction:column;gap:14px;padding:18px;border-radius:28px;background:var(--card);border:1px solid var(--line);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);color:var(--ink);text-align:left;width:100%}
.kn-today{gap:16px;padding:20px}
.kn-th{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.kn-th.c{align-items:center}
.kn-th h2,.kn-cardh h2{margin:0;font-size:18px;font-weight:700}
.kn-thl{display:flex;flex-direction:column;gap:8px}
.kn-daychip{align-self:flex-start;height:28px;padding:0 10px;border-radius:999px;background:rgba(var(--a),.12);color:var(--acc);font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px}
.kn-goalbtn{flex-shrink:0;height:42px;padding:0 14px;border-radius:999px;border:1px solid rgba(var(--a),.45)!important;color:var(--acc)!important;font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:7px}
.kn-arc{position:relative;height:170px;display:flex;justify-content:center}
.kn-arc svg{display:block}
.kn-arcmid{position:absolute;bottom:4px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:2px}
.kn-arcnum{font-family:var(--num);font-size:60px;font-weight:700;line-height:.95}
.kn-arcnum.mu{color:var(--muted)}
.kn-arcsub{font-size:13px;color:var(--muted)}
.kn-mts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kn-mt{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:18px;background:var(--surface)}
.kn-mt .v{font-size:13px;color:var(--muted)}
.kn-mt .v b{color:var(--ink);font-size:15px}
.kn-mt .bar,.kn-achi .bar{height:6px;border-radius:3px;background:var(--ktrack);overflow:hidden}
.kn-mt .bar i,.kn-achi .bar i{display:block;height:6px;border-radius:3px;background:var(--acc2)}
.kn-mt .l{font-size:13px;font-weight:600}
.kn-rem{display:flex;align-items:center;justify-content:center;gap:10px;padding:12px;border-radius:18px;background:var(--surface)}
.kn-rem .l{font-size:13px;color:var(--muted);font-weight:600}
.kn-rem .n{font-family:var(--num);font-size:22px;font-weight:700}
.kn-rem .n.a2{color:var(--acc2)}
.kn-rem .u{font-size:13px;color:var(--muted);margin-left:-6px}
.kn-rem i{width:4px;height:4px;border-radius:50%;background:var(--muted)}
.kn-pdone{padding:12px 14px;border-radius:18px;background:rgba(var(--a2),.08);border:1px solid rgba(var(--a2),.22);font-size:13px;font-weight:700;color:var(--acc2)}
.kn-note{padding:12px 14px;border-radius:18px;background:var(--surface);font-size:13px;line-height:1.45;color:var(--muted);text-align:center}
.kn-add{display:flex;flex-direction:column;align-items:center;gap:16px;padding:4px 0}
.kn-cam{width:96px;height:96px;border-radius:48px;background:var(--acc);color:var(--bg);display:flex;align-items:center;justify-content:center;margin-top:16px;position:relative;
  box-shadow:0 0 0 1.5px color-mix(in srgb,var(--acc) 55%,transparent) inset,0 0 0 12px color-mix(in srgb,var(--acc) 11%,transparent),0 0 0 24px color-mix(in srgb,var(--acc) 6%,transparent),0 0 0 36px color-mix(in srgb,var(--acc) 3%,transparent),0 14px 40px rgba(var(--a),.25);
  animation:kncampulse 2.6s ease-in-out infinite}
@keyframes kncampulse{
  0%,100%{box-shadow:0 0 0 1.5px color-mix(in srgb,var(--acc) 55%,transparent) inset,0 0 0 12px color-mix(in srgb,var(--acc) 11%,transparent),0 0 0 24px color-mix(in srgb,var(--acc) 6%,transparent),0 0 0 36px color-mix(in srgb,var(--acc) 3%,transparent),0 14px 40px rgba(var(--a),.25)}
  50%{box-shadow:0 0 0 1.5px color-mix(in srgb,var(--acc) 70%,transparent) inset,0 0 0 15px color-mix(in srgb,var(--acc) 14%,transparent),0 0 0 28px color-mix(in srgb,var(--acc) 8%,transparent),0 0 0 41px color-mix(in srgb,var(--acc) 3%,transparent),0 14px 40px rgba(var(--a),.3)}
}
@media (prefers-reduced-motion:reduce){.kn-cam{animation:none}}
.kn-camcap{font-size:14px;color:var(--muted);margin-top:8px;text-align:center}
.kn-tiles{width:100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kn-tiles button{height:66px;border-radius:20px;background:var(--surface);border:1px solid rgba(252,252,252,.07);color:var(--ink);display:flex;align-items:center;justify-content:center;gap:10px;font-size:15px;font-weight:700}
.kn-tiles svg{color:var(--acc)}
.kn-mic{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%}
.kn-mic>div{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-radius:16px;border:1px solid rgba(252,252,252,.07)}
.kn-mic .h{display:flex;justify-content:space-between;font-size:12px}
.kn-mic .h span{color:var(--muted)}
.kn-mic .bar{height:4px;border-radius:2px;background:var(--ktrack)}
.kn-mic .bar i{display:block;height:4px;border-radius:2px;background:var(--muted)}
.kn-meals{display:flex;flex-direction:column;gap:12px}
.kn-meals.past{gap:10px}
.kn-tip{display:flex;align-items:center;gap:12px;padding:12px 10px 12px 14px;border-radius:18px;background:rgba(var(--a2),.08);border:1px solid rgba(var(--a2),.22)}
.kn-tip>div{flex-grow:1;display:flex;flex-direction:column;gap:2px}
.kn-tip .t{font-size:12px;color:var(--acc2);font-weight:700}
.kn-tip b{font-size:14px;font-weight:700}
.kn-tip em{font-style:normal;font-size:12px;color:var(--muted)}
.kn-tip button{width:44px;height:44px;flex-shrink:0;border-radius:22px;background:var(--acc2);color:var(--bg);display:flex;align-items:center;justify-content:center}
.kn-sech{display:flex;justify-content:space-between;align-items:baseline}
.kn-sech h2,.kn-h2{margin:0;font-size:20px;font-weight:800}
.kn-sech span{font-size:13px;color:var(--muted)}
.kn-h3,.kn-cardh h3,.kn-favh h3{margin:0;font-size:16px;font-weight:700}
.kn-undo{position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;padding:6px 6px 6px 14px;border-radius:18px;background:var(--surface);border:1px solid rgba(252,252,252,.08)}
.kn-undoic{flex-shrink:0;color:var(--muted)}
.kn-undot{flex-grow:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.kn-undot b{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kn-undot em{font-style:normal;font-size:11px;color:var(--muted)}
.kn-undo button{min-height:44px;padding:0 12px;border-radius:12px;color:var(--acc);font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
.kn-undobar{position:absolute;left:0;bottom:0;height:2px;width:0;background:var(--acc);opacity:.5;animation:knUndo 5s linear forwards}
@keyframes knUndo{from{width:100%}to{width:0}}
.kn-undo.past .kn-undot{display:block;font-size:13px;font-weight:600}
.kn-meal{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:22px;background:rgba(252,252,252,.035);border:1px solid rgba(252,252,252,.07)}
.kn-mealh{display:flex;align-items:center;gap:10px;padding-left:4px}
.kn-meals.past .kn-mealh{min-height:22px}
.kn-mealt{flex-grow:1;display:flex;align-items:baseline;gap:8px}
.kn-mealt span{font-size:16px;font-weight:800}
.kn-mealt em{font-style:normal;font-size:13px;color:var(--muted)}
.kn-star{width:44px;height:44px;flex-shrink:0;border-radius:22px;display:flex;align-items:center;justify-content:center;padding:0;border:1px solid rgba(252,252,252,.12)!important;background:transparent}
.kn-star svg{fill:none;stroke:var(--muted)}
.kn-star.on{background:rgba(var(--a),.12);border-color:rgba(var(--a),.45)!important}
.kn-star.on svg{fill:var(--acc);stroke:var(--acc)}
.kn-saved{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 12px;border-radius:14px;background:rgba(var(--a),.12);color:var(--acc)}
.kn-saved span{flex-grow:1;font-size:12px;font-weight:700}
.kn-saved button{white-space:nowrap;min-height:44px;padding:0 10px;border-radius:999px;color:var(--acc);font-size:12px;font-weight:800}
.kn-row{display:flex;align-items:center;gap:2px;padding-right:4px;border-radius:16px;background:var(--surface)}
.kn-rowb{flex-grow:1;min-width:0;display:flex;align-items:center;gap:12px;padding:10px 6px 10px 10px;border-radius:16px;color:var(--ink);text-align:left}
.kn-time{width:44px;height:44px;flex-shrink:0;border-radius:14px;background:rgba(var(--a),.10);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--acc)}
.kn-rowi{flex-grow:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.kn-rowi .n{font-size:15px;font-weight:700}
.kn-rowi .s{font-size:12px;color:var(--muted)}
.kn-rowk{font-size:16px;font-weight:800;white-space:nowrap}
.kn-rowk small{font-size:11px;color:var(--muted);font-weight:500}
.kn-pen{flex-shrink:0;color:var(--muted)}
.kn-rowdel{width:44px;height:44px;flex-shrink:0;border-radius:12px;color:var(--muted)!important;display:flex;align-items:center;justify-content:center;padding:0}
.kn-ed{display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:16px;background:rgba(252,252,252,.03);border:1px solid rgba(var(--a),.35)}
.kn-ed.past{gap:6px}
.kn-edh{display:flex;align-items:center;gap:10px}
.kn-edh>span{flex-grow:1;font-size:13px;color:var(--muted);font-weight:600}
.kn-edf{height:46px;padding:0 12px;border-radius:14px;background:var(--bg);border:1px solid rgba(252,252,252,.10);display:flex;align-items:center;gap:4px}
.kn-edf input{width:64px;margin:0;border-radius:0;height:auto;border:0;background:transparent;color:var(--ink);font-family:var(--num);font-size:24px;font-weight:700;text-align:right;outline:none;padding:0}
.kn-edf span{font-size:14px;color:var(--muted)}
.gscale{-webkit-appearance:none;appearance:none;width:100%;height:36px;background:transparent;margin:0!important;padding:0;border:0;border-radius:0;display:block}
.gscale::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(90deg,var(--acc) var(--p),var(--ktrack) var(--p))}
.gscale::-moz-range-track{height:8px;border-radius:4px;background:linear-gradient(90deg,var(--acc) var(--p),var(--ktrack) var(--p))}
.gscale::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;margin-top:-10px;border-radius:50%;background:var(--ink);border:4px solid var(--acc);box-shadow:0 4px 12px rgba(0,0,0,.5)}
.gscale::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--ink);border:4px solid var(--acc)}
.kn-edsc{position:relative;height:16px;font-size:11px;color:var(--muted);font-weight:600}
.kn-edsc span{position:absolute}
.kn-edsc .b{transform:translateX(-50%);color:var(--acc)}
.kn-edb{display:flex;gap:6px}
.kn-eddel{flex:1;height:44px;border-radius:14px;border:1px solid var(--warnl)!important;color:var(--warn)!important;font-size:13px;font-weight:700}
.kn-edok{flex:1.4;height:44px;border-radius:14px;background:var(--acc);color:var(--bg)!important;font-size:13px;font-weight:800}
.kn-repeat{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;border:1px dashed rgba(252,252,252,.16)!important;color:var(--ink);text-align:left}
.kn-repeat svg{color:var(--acc);flex-shrink:0}
.kn-repeat span{flex-grow:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.kn-repeat b{font-size:14px;font-weight:700}
.kn-repeat em{font-style:normal;font-size:12px;color:var(--muted)}
.kn-favs{display:flex;flex-direction:column;gap:12px}
.kn-favs.e{gap:10px}
.kn-favh{position:relative;display:flex;justify-content:space-between;align-items:center}
.kn-favh>span{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.kn-ffbtn{min-height:44px;padding:0 10px 0 14px;border-radius:999px;border:1px solid rgba(var(--a),.35)!important;background:transparent;color:var(--acc)!important;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
.kn-ffbtn.on{background:rgba(var(--a),.12)}
.kn-ffbtn.on svg{transform:rotate(180deg)}

  var dur=5000,secs=5,cd=!!undo&&!o.restored;
  function subTxt(){return (sub?esc(sub):'')+(cd?(sub?' · ':'')+secs+' сек':'')}

    +'<span class="ttrack"><i class="tbar" style="animation-duration:'+dur+'ms"></i></span>';
  el.classList.remove("undoable","restored");if(cd)el.classList.add("undoable");if(o.restored)el.classList.add("restored");
  if(cd)toastI=setInterval(function(){secs=Math.max(0,secs-1);var ic=el.querySelector(".ticon"),em=el.querySelector(".ttxt em");if(ic)ic.textContent=secs;if(em)em.innerHTML=subTxt();if(!secs)clearInterval(toastI)},1000);

}

function screenAchievements(){
  var withStat=achList().map(function(a){var c=a.cur(),m=a.max(),done=c>=m,prog=!done&&c>0;return{a:a,c:c,m:m,done:done,prog:prog,locked:!done&&!prog};});
  var doneN=withStat.filter(function(x){return x.done}).length;
  var F=[["all","Все"],["done","Получены"],["prog","В процессе"],["locked","Закрыты"]];
  var filtered=achFilter==="all"?withStat:withStat.filter(function(x){return achFilter==="done"?x.done:achFilter==="prog"?x.prog:x.locked;});
  var cats=[];filtered.forEach(function(x){if(cats.indexOf(x.a.cat)<0)cats.push(x.a.cat)});
  var deg=Math.round(doneN/Math.max(1,withStat.length)*360);
  var closest=withStat.filter(function(x){return x.prog}).sort(function(a,b){return(b.c/b.m)-(a.c/a.m)})[0];
  var h='<div class="scrhead"><button class="scrback" data-a="screenback" aria-label="Назад">'+SVG_BACK+'</button><h1>Достижения</h1><span class="scrspacer"></span></div>';
  h+='<div class="achsum"><div class="achring" style="background:conic-gradient(var(--acc) 0deg '+deg+'deg,var(--track) '+deg+'deg 360deg)"><div class="in"><b>'+doneN+'<small>/'+withStat.length+'</small></b></div></div>'
    +'<div class="tx"><b>Получено '+doneN+' из '+withStat.length+'</b>'
    +(closest?'<span>Ближе всего: «'+esc(closest.a.title)+'» — осталось '+f(Math.round((closest.m-closest.c)*10)/10)+(closest.a.suf&&closest.a.suf!=="%"?closest.a.suf:"")+'</span>':(doneN===withStat.length?'<span>Все достижения получены</span>':''))
    +'</div></div>';
  h+='<div class="achfilters">'+F.map(function(x){
    var cnt=x[0]==="all"?withStat.length:withStat.filter(function(s){return x[0]==="done"?s.done:x[0]==="prog"?s.prog:s.locked;}).length;
    return '<button class="achf'+(achFilter===x[0]?" on":"")+'" data-a="achfilter" data-v="'+x[0]+'" aria-pressed="'+(achFilter===x[0])+'">'+x[1]+'<b>'+cnt+'</b></button>';
  }).join("")+'</div>';
  h+=cats.map(function(cat){
    var items=filtered.filter(function(x){return x.a.cat===cat});
    var full=withStat.filter(function(x){return x.a.cat===cat});
    var dFull=full.filter(function(x){return x.done}).length;
    return '<section class="achgroup"><div class="achgh"><h2>'+cat+'</h2><span>'+dFull+' из '+full.length+'</span></div>'+items.map(achRowHtml).join("")+'</section>';
  }).join("");
  if(!filtered.length)h+='<div style="text-align:center;color:var(--muted);font-size:13.5px;padding:20px 0">Ничего нет в этой категории</div>';
  var sp=document.getElementById("scrpage");sp.className="scrpage achscr";sp.innerHTML=h;
}

function doExport(){
  var data,filename;
  if(S.expFmt==="json"){
    data=JSON.stringify({workouts:S.m,history:S.history,weight:S.bw,food:S.food,water:S.kbWater,favorites:S.kbFav,foodGoal:kbGoalNow()},null,2);
    filename="gymtracker-export.json";
  }else{
    var rows=[["type","date","name","kcal_or_kg","protein_or_sets","fat_or_reps"]];
    S.history.forEach(function(e){rows.push(["workout",new Date(e.t).toISOString(),e.n,e.w,e.s,e.r])});
    S.bw.forEach(function(e){rows.push(["weight",new Date(e.t).toISOString(),"",e.w,"",""])});
    S.food.forEach(function(e){rows.push(["food",new Date(e.t).toISOString(),e.name,e.kcal,e.p,e.f])});
    data=rows.map(function(r){return r.map(function(v){return '"'+String(v==null?"":v).replace(/"/g,'""')+'"'}).join(",")}).join("\n");
    filename="gymtracker-export.csv";
  }
  if(!window.claude||typeof window.claude.use!=="function"){redesignDownloadExport(data,filename);return}
  window.claude.use("downloads").then(function(downloads){
    if(!downloads){toast("Экспорт недоступен в этом окне");return}
    downloads.save({filename:filename,data:data}).then(function(){
      toast("Файл выгружен: "+filename);expDone=true;if(scrStack[scrStack.length-1]==="settings")renderScreenView();
    }).catch(function(err){
      if(err&&err.code==="declined")return;
      toast("Не удалось выгрузить файл");
    });
  }).catch(function(){toast("Экспорт недоступен в этом окне")});
}

function maxGain(){

  S.m.forEach(function(m){
    var start=m.h.length?m.h[m.h.length-1].w:m.w;

function navPillX(){
  var nav=document.getElementById("nav");
  var idx=-1;NAV_ITEMS.forEach(function(it,i){if(it[0]===S.tab)idx=i});
  if(idx<0||nav.clientWidth<120)return null;
  var W=nav.clientWidth-12,A=106;
  return idx*(W-A)/(NAV_ITEMS.length-1);
}
function syncNavPill(animate){
  var nav=document.getElementById("nav"),pill=document.getElementById("navpill");
  if(!nav||!pill)return;
  var x=navPillX();
  if(x===null){pill.style.opacity=0;navPrevX=null;return}
  pill.style.opacity=1;
  var from=navPrevX;navPrevX=x;
  pill.style.transform="translateX("+x+"px)";
  var reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(!animate||from===null||from===x||reduce||!pill.animate)return;
  var d=x-from,dir=d>0?1:-1,dist=Math.min(1,Math.abs(d)/240);
  pill.style.setProperty("--gx",dir>0?"85%":"15%");
  pill.classList.add("moving");
  if(pill._anim)pill._anim.cancel();
  pill._anim=pill.animate([
    {transform:"translateX("+from+"px) scale(1,1)"},
    {transform:"translateX("+(from+d*.18)+"px) scale("+(1+.1*dist)+","+(1-.06*dist)+")",offset:.18},
    {transform:"translateX("+(from+d*.72)+"px) scale("+(1+.22*dist)+","+(1-.1*dist)+")",offset:.5},
    {transform:"translateX("+(x+dir*6*dist)+"px) scale("+(1-.05*dist)+","+(1+.04*dist)+")",offset:.8},
    {transform:"translateX("+x+"px) scale(1,1)"}
  ],{duration:560,easing:"cubic-bezier(.3,.7,.2,1)"});
  pill._anim.onfinish=pill._anim.oncancel=function(){pill.classList.remove("moving")};
}
(function(){var n=document.getElementById("nav");if(n&&window.ResizeObserver)new ResizeObserver(function(){navPrevX=null;syncNavPill(false)}).observe(n);else window.addEventListener("resize",function(){navPrevX=null;syncNavPill(false)})})();

function chrono(h){return h.slice().sort(function(a,b){return a.t-b.t})}
function weekSeries(h){
  var arr=chrono(h),cutoff=now-7*DAY,r=arr.filter(function(e){return e.t>=cutoff});
  if(r.length<2)r=arr.slice(-7);
  return r;
}
function monthSeries(h){
  var arr=chrono(h),map={},keys=[];
  arr.forEach(function(e){var d=new Date(e.t),k=d.getFullYear()+"-"+d.getMonth();
    if(!map[k]){map[k]={t:e.t,sum:0,n:0};keys.push(k)}
    map[k].sum+=e.w;map[k].n++;map[k].t=e.t;
  });
  keys=keys.slice(-6);
  return keys.map(function(k){return{t:map[k].t,w:Math.round(map[k].sum/map[k].n*10)/10}});
}
function getSeries(h,range){return range==="month"?monthSeries(h):weekSeries(h)}
var MON=["янв","фев","мар","апр","май","июн","июл","авг","сен","окт","ноя","дек"];
function dayLabel(t){var d=new Date(t);return d.getDate()+" "+MON[d.getMonth()]}
function monthLabel(t){var d=new Date(t);var m=MON[d.getMonth()];return m.charAt(0).toUpperCase()+m.slice(1)}
function axisChart(vals,dates,color,labelFn){
  if(!vals.length)return '<p style="margin:8px 0 0;font-size:12.5px;color:var(--muted)">Пока мало данных для графика</p>';
  if(vals.length===1){
    var W1=300,H1=150,pl=30,pr=6,pt=10,pb=20,v1=vals[0],yy=pt+(H1-pt-pb)/2,gr1="";
    [v1+1,v1,v1-1].forEach(function(t,i){var y=pt+i*(H1-pt-pb)/2;
      gr1+='<line x1="'+pl+'" y1="'+y.toFixed(1)+'" x2="'+(W1-pr)+'" y2="'+y.toFixed(1)+'" stroke="var(--line)" stroke-width="1"/>'
        +'<text x="0" y="'+(y+3).toFixed(1)+'" font-size="9" fill="var(--muted)" font-family="Manrope,sans-serif">'+f(Math.round(t*10)/10)+'</text>'});
    return '<svg viewBox="0 0 '+W1+' '+H1+'" aria-hidden="true">'+gr1
      +'<path d="M'+pl+' '+yy.toFixed(1)+' H'+(W1-pr-4)+'" fill="none" stroke="'+color+'" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 7" opacity=".55"/>'
      +'<circle cx="'+(W1-pr-4)+'" cy="'+yy.toFixed(1)+'" r="4.5" fill="'+color+'"/>'
      +'<text x="'+(W1-pr)+'" y="'+(H1-4)+'" font-size="9" fill="var(--muted)" font-family="Manrope,sans-serif" text-anchor="end">'+labelFn(dates[0])+'</text></svg>';
  }
  var W=300,H=150,padL=30,padR=6,padT=10,padB=20;
  var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals);
  if(mn===mx){mn-=1;mx+=1}
  var iw=W-padL-padR,ih=H-padT-padB;
  var xy=vals.map(function(v,i){return[padL+(vals.length===1?0:i*(iw/(vals.length-1))),padT+ih-(v-mn)/(mx-mn)*ih]});
  var d="M"+xy[0][0].toFixed(1)+" "+xy[0][1].toFixed(1);
  for(var i=1;i<xy.length;i++){var p0=xy[i-1],p1=xy[i],mxp=(p0[0]+p1[0])/2;d+=" C "+mxp.toFixed(1)+" "+p0[1].toFixed(1)+" "+mxp.toFixed(1)+" "+p1[1].toFixed(1)+" "+p1[0].toFixed(1)+" "+p1[1].toFixed(1)}
  var ticks=[mx,(mx+mn)/2,mn],grid="";
  ticks.forEach(function(t){var y=padT+ih-(t-mn)/(mx-mn)*ih;
    grid+='<line x1="'+padL+'" y1="'+y.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+y.toFixed(1)+'" stroke="var(--line)" stroke-width="1"/>'
       +'<text x="0" y="'+(y+3).toFixed(1)+'" font-size="9" fill="var(--muted)" font-family="Manrope,sans-serif">'+f(Math.round(t*10)/10)+'</text>';});
  var n=vals.length,step=Math.max(1,Math.round((n-1)/2)),xl="",idx=[];
  for(var i2=0;i2<n;i2+=step)idx.push(i2);
  if(idx[idx.length-1]!==n-1){if(n-1-idx[idx.length-1]<step/2)idx.pop();idx.push(n-1)}
  idx.forEach(function(k){var anc=k===0?"start":k===n-1?"end":"middle";xl+='<text x="'+xy[k][0].toFixed(1)+'" y="'+(H-4)+'" font-size="9" fill="var(--muted)" font-family="Manrope,sans-serif" text-anchor="'+anc+'">'+labelFn(dates[k])+'</text>'});
  var last=xy[xy.length-1];
  return '<svg viewBox="0 0 '+W+' '+H+'" aria-hidden="true">'+grid+'<path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="4.5" fill="'+color+'"/>'+xl+'</svg>';
}

  var t0=dayKey===kbToday()?Date.now():keyTime(dayKey,MEAL_TIME[meal]),ids=[];

function kbGoalCalc(g,train,key){
  var bw=(key?kbWeightAt(key):kbWeight())||70;
  if(g.mode==="auto"){
    var np=!(g.height&&g.age),gh=g.height||175,ga=g.age||28;
    var bmr=10*bw+6.25*gh-5*ga+(S.gender==="f"?-161:5);
    var base=kbR50(bmr*[1.375,1.55,1.725][g.act||0]*[0.85,1,1.1][g.goal||0]);
    var delta=g.bonus?(train?150:-100):0,k=base+delta;
    var P=kbR5((g.pkg||2)*bw),F=kbR5(0.9*bw),C=Math.max(0,kbR5((k-P*4-F*9)/4));
    return {k:k,p:P,c:C,f:F,base:base,auto:true,bonus:!!g.bonus,train:!!train,delta:delta,noProfile:np};
  }
  var mk=+g.kcal||2200;
  return {k:mk,p:+g.p||140,c:+g.c||250,f:+g.f||70,base:mk,auto:false,bonus:false,train:!!train,delta:0};
}

function kbWeek(){
  var tk=kbToday(),ti=WEEK_T.map(dateKey).indexOf(tk),budget=0,eatPast=0,goalPast=0,future=0,used=0,tE=0,tG=0;
  WEEK_T.forEach(function(t,i){var k=dateKey(t);
    if(i<=ti){var g=kbGoalFor(k).k,e=kbTotals(dayItems(k)).k;budget+=g;used+=e;if(i<ti){eatPast+=e;goalPast+=g}else{tE=e;tG=g}}
    else{var b=kbGoalCalc(kbGoalSettingsAt(k),false,k).base;budget+=b;if(i<6)future+=b}});
  var sunday=ti===6?budget-eatPast:budget-eatPast-Math.max(tE,tG)-future;
  return {budget:budget,used:used,diff:eatPast-goalPast,ti:ti,sunday:sunday};
}

function kbMorph(a,b){
  var ac=a.childNodes,bc=b.childNodes,i;
  for(i=0;i<bc.length;i++){
    var bn=bc[i],an=ac[i];
    if(!an){a.appendChild(bn.cloneNode(true));continue}
    if(an.nodeType!==bn.nodeType||an.nodeName!==bn.nodeName||(an.nodeType===1&&an.getAttribute("data-key")!==bn.getAttribute("data-key"))){a.replaceChild(bn.cloneNode(true),an);continue}
    if(an.nodeType!==1){if(an.nodeValue!==bn.nodeValue)an.nodeValue=bn.nodeValue;continue}
    var aa=an.attributes,ba=bn.attributes,j;
    for(j=aa.length-1;j>=0;j--)if(!bn.hasAttribute(aa[j].name))an.removeAttribute(aa[j].name);
    for(j=0;j<ba.length;j++)if(an.getAttribute(ba[j].name)!==ba[j].value)an.setAttribute(ba[j].name,ba[j].value);
    if(an.nodeName==="TEXTAREA"){if(an!==document.activeElement&&an.value!==bn.value)an.value=bn.value;continue}
    if(an.nodeName==="INPUT"){var nv=bn.getAttribute("value")||"";if(an!==document.activeElement&&an.value!==nv)an.value=nv;continue}
    kbMorph(an,bn);
  }
  while(ac.length>bc.length)a.removeChild(a.lastChild);
}

function kbWeightAt(key){var a=chrono(S.bw);if(!a.length)return null;var end=keyTime(key,"23:59"),w=a[0].w;a.forEach(function(e){if(e.t<=end)w=e.w});return w}

function kbInsQual(){
  var fd={},wd={},out=[];S.food.forEach(function(e){fd[dateKey(e.t)]=1});S.bw.forEach(function(e){wd[dateKey(e.t)]=1});
  Object.keys(fd).forEach(function(k){if(wd[k])out.push(k)});

/* kbInsRec() — «Твой реальный расход» по последним 14 дням с едой и весом: TDEE ≈ средняя еда − Δвес·7700/дни */
function kbInsRec(){
  var q=kbInsQual().slice(-14);if(q.length<2)return null;
  var sum=0;q.forEach(function(k){sum+=kbTotals(dayItems(k)).k});var avg=sum/q.length;
  var w0=kbWeightOn(q[0]),w1=kbWeightOn(q[q.length-1]),span=Math.max(1,Math.round((keyTime(q[q.length-1])-keyTime(q[0]))/DAY));
  var perDay=(w1-w0)/span,tdee=Math.round((avg-perDay*7700)/10)*10;
  var gi=S.kbGoal&&S.kbGoal.goal!=null?S.kbGoal.goal:0,target=KG_RATE[gi]||0;
  var train=Math.max(1200,Math.min(6000,kbR50(tdee+target*7700/7)));
  return {avg:Math.round(avg/10)*10,rate:perDay*7,tdee:tdee,target:target,goal:gi,train:train,rest:train-250,n:q.length,dw:w1-w0};
}

  var pre=dK===dateKey(now)?"Сегодня":dK===dateKey(now-DAY)?"Вчера":DAYS[(d.getDay()+6)%7];
  return pre+" · "+dayLabel(t);
}
function numv(x){return +String(x==null?"":x).replace(",",".")||0}
function plural(n,a,b,c){var m=n%10,mm=n%100;return m===1&&mm!==11?a:(m>=2&&m<=4&&(mm<10||mm>=20)?b:c)}
function thous(n){return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g," ")}
function histItems(){
  var bwc=chrono(S.bw),items=[];
  S.history.forEach(function(e){items.push({k:"w",t:e.t,e:e})});
  S.food.forEach(function(e){items.push({k:"f",t:e.t,e:e})});
  bwc.forEach(function(e,i){items.push({k:"b",t:e.t,e:e,prev:i?bwc[i-1]:null})});
  items.sort(function(x,y){return y.t-x.t});
  return items;
}
function histRow(it){
  var e=it.e,ic,name,sub,val,unit,cls="",attrs="";
  if(it.k==="w"){ic="workout";name=esc(e.n);var em=find(e.mid),et=exType(em);sub=esc(e.g)+' · '+(e.sets&&e.sets.length?e.sets.map(function(x){return et==="time"?x.r+' сек':(et==="body"&&!x.w?'':f(x.w)+'×')+x.r}).join(' · '):e.s+'×'+e.r)+' · '+timeLabel(e.t);val=et==="time"?(e.r||0):f(e.w);unit=et==="time"?"сек":"кг"}
  else if(it.k==="f"){ic="kbju";cls=" ink";name=esc(e.name||"Без названия");sub=esc(e.meal||"")+' · Б '+f(numv(e.p))+' · Ж '+f(numv(e.f))+' · У '+f(numv(e.c));val=thous(numv(e.kcal));unit="ккал";attrs=' data-a="foodopen" data-v="'+e.id+'" role="button" tabindex="0" style="cursor:pointer"'}
  else{ic="weight";cls=" ink";name="Вес тела";var dd=it.prev?Math.round((e.w-it.prev.w)*10)/10:null;
    sub=(e.fast===false?'Взвешивание':'Утром, натощак')+(dd?' · '+(dd>0?'+':'−')+fmt1(Math.abs(dd))+' кг':'');val=fmt1(e.w);unit="кг"}
  var k=it.k==="w"?"":" "+it.k;
  return '<div class="hrow"'+attrs+'><div class="hic'+k+'"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+NAV_ICONS[ic]+'</svg></div>'
    +'<div class="hinfo"><div class="hname">'+name+'</div><div class="hsub">'+sub+'</div></div>'
    +'<div class="hwt'+cls+'">'+val+'<small>'+unit+'</small></div></div>';
}
function viewHistory(){
  var h=header();
  var all=histItems();
  if(!all.length){
    h+='<div class="sec-h"><h3>История</h3><span class="val muted">0 записей</span></div>';
    h+=emptyState(NAV_ICONS.history,'Здесь будет твой путь','Каждая тренировка, приём пищи и взвешивание попадут сюда — с датами и прогрессом.');
    h+='<div class="estate-actions"><button class="save" data-a="tab" data-v="workout">Начать тренировку</button>'
      +'<button class="outline" data-a="logopen"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+NAV_ICONS.weight+'</svg>Записать вес</button></div>';
    document.getElementById("appcontent").innerHTML=h;
    return;
  }
  var items=all.filter(function(it){return histF==="all"||it.k===histF});
  var n=items.length;
  h+='<div class="sec-h"><h3>История</h3><div class="hsecr"><span class="val'+(n?'':' muted')+'">'+n+' '+plural(n,'запись','записи','записей')+'</span><button class="hclr cm" data-a="hclear" aria-label="Очистить историю">'+SVG_TRASH+'</button></div></div>';
  h+='<div class="hfilt" role="group" aria-label="Фильтр">'+[["all","Все"],["w","Тренировки"],["f","Питание"],["b","Вес"]].map(function(x){
    var on=histF===x[0];return '<button class="hf'+(on?' on':'')+'" data-a="hf" data-v="'+x[0]+'" aria-pressed="'+on+'">'+x[1]+'</button>'}).join("")+'</div>';
  // summary (last 7 days, not affected by filter)
  var wk=now-7*DAY,wd={},fd={};
  S.history.forEach(function(e){if(e.t>=wk)wd[dateKey(e.t)]=1});
  S.food.forEach(function(e){if(e.t>=wk){var k=dateKey(e.t);fd[k]=(fd[k]||0)+numv(e.kcal)}});
  var fk=Object.keys(fd),avg=fk.length?fk.reduce(function(a,k){return a+fd[k]},0)/fk.length:null;
  var bch=bwChange(7),lastBwW=S.bw.length?chrono(S.bw)[S.bw.length-1].w:null; // в сводке — актуальный вес, изменение за неделю строкой ниже
  h+='<div class="hstats">'
    +'<div class="hstat cm"><em>Тренировок</em><b>'+Object.keys(wd).length+'<small> за нед.</small></b></div>'
    +'<div class="hstat cm"><em>Ср. калории</em><b>'+(avg==null?'—':thous(avg))+'</b></div>'
    +'<div class="hstat cm"><em>Вес</em><b class="a2">'+(lastBwW==null?'—':f(lastBwW)+'<small> кг</small>')+'</b>'+(bch!=null&&bch!==0?'<small class="hdelta">'+(bch>0?'+':'−')+f(Math.abs(bch))+' кг за нед.</small>':'')+'</div></div>';
  var groups=[],map={};
  items.forEach(function(it){var k=dateKey(it.t);if(!map[k]){map[k]={t:it.t,items:[]};groups.push(k)}map[k].items.push(it)});
  h+=groups.map(function(k){var g=map[k];
    return '<div class="hgroup"><div class="hday">'+histDayHeader(g.t)+'</div><div class="hlist">'+g.items.map(histRow).join("")+'</div></div>';
  }).join("");
  if(!n)h+='<p class="hempty">Нет записей в этом разделе</p>';
  document.getElementById("appcontent").innerHTML=h;
}

function applyBgTransform(){
  var el=document.getElementById("bglayer");
  if(el)el.style.transform="translate("+S.bgX+"px,"+S.bgY+"px) scale("+S.bgScale+")";
}
function syncBgHeight(){
  var ap=document.getElementById("app"),bg=document.getElementById("appbg");
  if(bg&&getComputedStyle(bg).display==="none"){bg.style.height="";return} /* в новом дизайне слоя нет — ничего не подгоняем */
  if(ap&&bg){var acx=document.getElementById("appcontent"),need=ap.clientHeight;
    if(acx){var pb=parseFloat(getComputedStyle(ap).paddingBottom)||0;need=Math.max(need,acx.offsetTop+acx.offsetHeight+pb)}
    var hpx=Math.ceil(need)+"px";if(bg.style.height!==hpx)bg.style.height=hpx}
  /* Экраны дорисовываются после render() (утверждённый вид подменяет разметку), и высота страницы меняется.
     Раньше фон оставался высотой старой разметки — внизу «Питания» появлялся целый экран пустоты. */
  var ac=document.getElementById("appcontent");
  if(ac&&window.ResizeObserver&&!ac._bgObs){var q=0;ac._bgObs=new ResizeObserver(function(){if(q)return;q=requestAnimationFrame(function(){q=0;syncBgHeight()})});ac._bgObs.observe(ac)}
}

function confetti(n){
  var cols=["var(--acc)","var(--acc2)","color-mix(in srgb,var(--acc) 40%,white)","var(--ink)"],out="";
  for(var i=0;i<n;i++){
    var l=Math.round(Math.random()*311+53),t=Math.round(Math.random()*367+86);
    var w=[6,8,10][Math.floor(Math.random()*3)],ht=[4,10,14][Math.floor(Math.random()*3)];
    var rot=Math.round(Math.random()*116-58),op=(Math.random()*.48+.5).toFixed(2);
    var c=cols[i%cols.length];
    out+='<span class="confetti" style="left:'+l+'px;top:'+t+'px;width:'+w+'px;height:'+ht+'px;opacity:'+op+';transform:rotate('+rot+'deg);background:'+c+'"></span>';
  }
  return out;
}
